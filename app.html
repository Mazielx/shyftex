<!DOCTYPE html>
<html lang="es" data-theme="light" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHYFTEX</title>
<style>
/* ═══════════════════════════════════════════
   THEME SYSTEM — Light / Dark / System
   ═══════════════════════════════════════════ */
:root,[data-theme="light"] {
  --bg:#FAFBFC;--surface:#FFFFFF;--surface2:#F4F5F7;--surface3:#E8EAED;
  --border:#E4E6EA;--border2:#D0D3D8;
  --text:#1A1D21;--text2:#5F6B7A;--text3:#8B95A5;--text-inv:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.04);--shadow2:0 2px 8px rgba(0,0,0,.06);
  --shadow3:0 4px 16px rgba(0,0,0,.08);
  --ok:#16A34A;--ok-l:#F0FDF4;--warn:#D97706;--warn-l:#FFFBEB;
  --err:#DC2626;--err-l:#FEF2F2;--info:#2563EB;--info-l:#EFF6FF;
  --overlay:rgba(0,0,0,.35);
}
[data-theme="dark"] {
  --bg:#111318;--surface:#1A1D23;--surface2:#242830;--surface3:#2E333C;
  --border:#2A2F38;--border2:#3A404A;
  --text:#E8EAED;--text2:#9AA1B0;--text3:#6B7280;--text-inv:#111318;
  --shadow:0 1px 2px rgba(0,0,0,.2);--shadow2:0 2px 8px rgba(0,0,0,.25);
  --shadow3:0 4px 16px rgba(0,0,0,.35);
  --ok:#22C55E;--ok-l:#052E16;--warn:#FBBF24;--warn-l:#422006;
  --err:#EF4444;--err-l:#450A0A;--info:#3B82F6;--info-l:#172554;
  --overlay:rgba(0,0,0,.5);
}
/* Accent color palettes */
[data-accent="green"]  {--acc:#1A8F50;--acc-l:#F0FAF4;--acc-d:#157A43;--acc-t:#106336;}
[data-accent="blue"]   {--acc:#2563EB;--acc-l:#F0F5FF;--acc-d:#1D4ED8;--acc-t:#1E3A8A;}
[data-accent="red"]    {--acc:#C43030;--acc-l:#FEF2F2;--acc-d:#A82828;--acc-t:#8B2020;}
[data-accent="pink"]   {--acc:#C94283;--acc-l:#FDF2F8;--acc-d:#AB3670;--acc-t:#8E2B5D;}
[data-accent="purple"] {--acc:#7C3AED;--acc-l:#F5F0FF;--acc-d:#6C2AD4;--acc-t:#5B20BA;}
[data-accent="orange"] {--acc:#D97706;--acc-l:#FFF8F0;--acc-d:#C26A05;--acc-t:#A35804;}
[data-accent="yellow"] {--acc:#B8941A;--acc-l:#FEFCE8;--acc-d:#A08015;--acc-t:#886C10;}
[data-accent="gold"]   {--acc:#A06A1A;--acc-l:#FFFBEB;--acc-d:#8C5C15;--acc-t:#744D10;}

/* ═══════════════════════════════════════════
   BASE RESET & TYPOGRAPHY
   ═══════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',Roboto,sans-serif;background:#E8EAED;display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

/* ═══════════════════════════════════════════
   PHONE FRAME
   ═══════════════════════════════════════════ */
.phone{width:390px;height:844px;background:var(--bg);border-radius:40px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 20px rgba(0,0,0,.1);display:flex;flex-direction:column;position:relative}
.phone::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:30px;background:#000;border-radius:0 0 20px 20px;z-index:100}

/* ═══════════════════════════════════════════
   STATUS BAR
   ═══════════════════════════════════════════ */
.statusbar{height:54px;background:var(--surface);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;color:var(--text);font-size:13px;font-weight:600;flex-shrink:0;z-index:50}

/* ═══════════════════════════════════════════
   SCREEN CONTAINER
   ═══════════════════════════════════════════ */
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.screen{display:none;flex-direction:column;min-height:100%}
.screen.on{display:flex}

/* ═══════════════════════════════════════════
   NAVIGATION BAR (top)
   ═══════════════════════════════════════════ */
.navbar{background:var(--surface);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid var(--border)}
.navbar h2{flex:1;font-size:16px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;color:var(--text);display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background .15s}
.icon-btn:active{background:var(--surface2)}

/* ═══════════════════════════════════════════
   TAB BAR (bottom)
   ═══════════════════════════════════════════ */
.tabbar{height:56px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text3);transition:color .2s;border:none;background:none;-webkit-tap-highlight-color:transparent}
.tab.on{color:var(--acc)}
.tab svg{width:20px;height:20px}
.tab span{font-size:9px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}

/* ═══════════════════════════════════════════
   CONTENT AREA
   ═══════════════════════════════════════════ */
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:24px}
.content::-webkit-scrollbar{display:none}

/* ═══════════════════════════════════════════
   CARDS
   ═══════════════════════════════════════════ */
.card{background:var(--surface);border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid var(--border);box-shadow:var(--shadow)}

/* ═══════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════ */
.btn{border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;font-family:inherit;-webkit-tap-highlight-color:transparent;letter-spacing:.01em}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--acc);color:#fff;padding:13px 20px;width:100%}
.btn-p:hover{background:var(--acc-d)}
.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-s{background:var(--surface);color:var(--acc);border:1px solid var(--border);padding:11px 20px;width:100%}
.btn-ghost{background:none;color:var(--acc);padding:10px 16px;width:100%}
.btn-danger{background:var(--err);color:#fff;padding:11px 20px;width:100%}
.btn-icon{width:32px;height:32px;border-radius:8px;padding:0;flex-shrink:0}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:7px}

/* ═══════════════════════════════════════════
   INPUTS
   ═══════════════════════════════════════════ */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;letter-spacing:.02em;text-transform:uppercase}
.field label em{color:var(--err);font-style:normal}
.input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:var(--surface);transition:border-color .2s;font-family:inherit}
.input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-l)}
textarea.input{min-height:100px;resize:none;line-height:1.5}
.input-hint{font-size:11px;color:var(--text3);margin-top:3px}

/* ═══════════════════════════════════════════
   BADGES & TAGS
   ═══════════════════════════════════════════ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;letter-spacing:.02em}
.badge-ok{background:var(--ok-l);color:var(--ok)}
.badge-info{background:var(--info-l);color:var(--info)}
.badge-warn{background:var(--warn-l);color:var(--warn)}
.badge-err{background:var(--err-l);color:var(--err)}
.badge-muted{background:var(--surface2);color:var(--text2)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:500;background:var(--acc-l);color:var(--acc)}

/* ═══════════════════════════════════════════
   ITEM CARDS
   ═══════════════════════════════════════════ */
.item{background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);cursor:pointer;transition:background .15s}
.item:active{background:var(--surface2)}
.item .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.item .info{flex:1;min-width:0}
.item .name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:11px;color:var(--text3);margin-top:1px}
.item .right{text-align:right;flex-shrink:0}
.item .price{font-size:14px;font-weight:700;color:var(--acc)}
.item .old{font-size:10px;color:var(--text3);text-decoration:line-through}

/* ═══════════════════════════════════════════
   SETTINGS
   ═══════════════════════════════════════════ */
.sg{margin-bottom:16px}
.sg-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:0 4px 6px}
.si{display:flex;align-items:center;gap:10px;background:var(--surface);padding:12px 14px;border-radius:10px;margin-bottom:3px;border:1px solid var(--border);cursor:pointer;transition:background .15s}
.si:active{background:var(--surface2)}
.si .s-ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--acc-l);color:var(--acc);flex-shrink:0}
.si .s-ic svg{width:16px;height:16px}
.si .s-body{flex:1}
.si .s-title{font-size:14px;font-weight:500;color:var(--text)}
.si .s-desc{font-size:11px;color:var(--text3);margin-top:1px}
.si .s-val{font-size:12px;color:var(--text2);font-weight:500;margin-right:4px}
.si .s-arr{color:var(--text3);display:flex}

/* ═══════════════════════════════════════════
   HERO CTA
   ═══════════════════════════════════════════ */
.hero{background:var(--acc);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;color:#fff;margin-bottom:16px;transition:transform .1s;border:none;text-align:left;width:100%;font-family:inherit}
.hero:active{transform:scale(.98)}
.hero .h-body{flex:1}
.hero .h-title{font-size:14px;font-weight:600}
.hero .h-sub{font-size:11px;opacity:.8;margin-top:1px}
.hero .h-arrow{opacity:.6}

/* ═══════════════════════════════════════════
   STATS ROW
   ═══════════════════════════════════════════ */
.stats{display:flex;gap:8px;margin-bottom:16px}
.stat{flex:1;background:var(--surface);border-radius:8px;padding:10px 8px;text-align:center;border:1px solid var(--border)}
.stat .sv{font-size:18px;font-weight:700;color:var(--text)}
.stat .sl{font-size:10px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}

/* ═══════════════════════════════════════════
   SAVINGS BANNER
   ═══════════════════════════════════════════ */
.savings{background:var(--acc);border-radius:10px;padding:14px;color:#fff;margin-bottom:12px}
.savings .s-label{font-size:12px;opacity:.8}
.savings .s-amount{font-size:28px;font-weight:700;margin-top:1px}

/* ═══════════════════════════════════════════
   ROUTE METRICS
   ═══════════════════════════════════════════ */
.metrics{display:flex;justify-content:space-around;padding:14px 0}
.metric{text-align:center}
.metric .mv{font-size:15px;font-weight:700;color:var(--text)}
.metric .ml{font-size:10px;color:var(--text3);margin-top:1px;text-transform:uppercase;letter-spacing:.03em}

/* ═══════════════════════════════════════════
   STORE STOPS
   ═══════════════════════════════════════════ */
.stop{background:var(--surface);border-radius:10px;padding:14px;margin-bottom:8px;border:1px solid var(--border)}
.stop-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stop-num{width:24px;height:24px;border-radius:7px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.stop-body{flex:1}
.stop-name{font-size:15px;font-weight:600;color:var(--text)}
.stop-addr{font-size:12px;color:var(--text3)}
.stop-cost{font-size:16px;font-weight:700;color:var(--acc);flex-shrink:0}
.stop-items{border-top:1px solid var(--border);padding-top:10px;margin-top:4px}
.si-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.si-row .si-dot{color:var(--acc);font-size:10px}
.si-row .si-n{flex:1;color:var(--text)}
.si-row .si-q{color:var(--text3)}
.si-row .si-p{font-weight:600;color:var(--text)}
.promo-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}

/* ═══════════════════════════════════════════
   SUMMARY ROWS
   ═══════════════════════════════════════════ */
.sr{display:flex;justify-content:space-between;padding:6px 0}
.sr .sl{font-size:14px;color:var(--text2)}
.sr .sv{font-size:14px;font-weight:500;color:var(--text)}
.sr-total{border-top:1px solid var(--border);margin-top:4px;padding-top:10px}
.sr-total .sl{font-weight:600;color:var(--text)}
.sr-total .sv{font-weight:700;font-size:16px;color:var(--acc)}

/* ═══════════════════════════════════════════
   MISSION
   ═══════════════════════════════════════════ */
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog-fill{height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.prog-text{font-size:12px;color:var(--text3);text-align:center;margin-bottom:12px}
.mi{background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;border:1px solid var(--border)}
.mi .mi-info{flex:1}
.mi .mi-name{font-size:13px;font-weight:500;color:var(--text)}
.mi .mi-sub{font-size:11px;color:var(--text3)}
.mi .mi-acts{display:flex;gap:6px}
.mi-btn{width:30px;height:30px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.mi-btn:active{transform:scale(.9)}
.mi-btn.ok{background:var(--ok);color:#fff}
.mi-btn.no{background:var(--err);color:#fff}
.mi.found{background:var(--ok-l);border-color:var(--ok)}
.mi.missed{background:var(--err-l);border-color:var(--err)}

/* ═══════════════════════════════════════════
   EXPLANATION
   ═══════════════════════════════════════════ */
.exp{background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;gap:8px;margin-bottom:5px;border:1px solid var(--border)}
.exp .exp-icon{flex-shrink:0;color:var(--acc);margin-top:1px}
.exp .exp-text{font-size:12px;color:var(--text2);line-height:1.4}

/* ═══════════════════════════════════════════
   CONFIDENCE
   ═══════════════════════════════════════════ */
.conf{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:12px}
.conf.high{background:var(--ok-l);color:var(--ok)}
.conf.med{background:var(--info-l);color:var(--info)}

/* ═══════════════════════════════════════════
   AUTH
   ═══════════════════════════════════════════ */
.auth{padding:32px 24px;display:flex;flex-direction:column;justify-content:center;min-height:100%}
.auth-title{text-align:center;font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.auth-sub{text-align:center;font-size:13px;color:var(--text3);margin-top:4px;margin-bottom:28px}
.auth-field{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 13px;margin-bottom:8px;transition:border-color .2s}
.auth-field:focus-within{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-l)}
.auth-field svg{width:16px;height:16px;color:var(--text3);margin-right:10px;flex-shrink:0}
.auth-field input{flex:1;border:none;padding:12px 0;font-size:14px;color:var(--text);background:transparent;outline:none;font-family:inherit}
.auth-link{text-align:center;margin-top:14px;font-size:13px;color:var(--text3)}
.auth-link a{color:var(--acc);font-weight:600;text-decoration:none;cursor:pointer}

/* ═══════════════════════════════════════════
   ONBOARDING
   ═══════════════════════════════════════════ */
.onboard{padding:28px 24px;display:flex;flex-direction:column;min-height:100%}
.onboard .step-indicator{display:flex;gap:5px;margin-bottom:28px;justify-content:center}
.onboard .step-dot{width:6px;height:6px;border-radius:3px;background:var(--surface3);transition:all .3s}
.onboard .step-dot.on{background:var(--acc);width:20px}
.onboard .step-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:-.02em}
.onboard .step-desc{font-size:14px;color:var(--text3);line-height:1.4;margin-bottom:24px}
.onboard .step-body{flex:1}
.onboard .step-footer{padding-top:16px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.opt-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;text-align:center;transition:all .2s}
.opt-card:active{transform:scale(.98)}
.opt-card.sel{border-color:var(--acc);background:var(--acc-l)}
.opt-card .oc-icon{font-size:22px;margin-bottom:4px}
.opt-card .oc-label{font-size:12px;font-weight:600;color:var(--text)}
.opt-card .oc-desc{font-size:11px;color:var(--text3);margin-top:2px}
.color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.color-opt{width:100%;aspect-ratio:1;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center}
.color-opt:active{transform:scale(.9)}
.color-opt.sel{border-color:var(--text);box-shadow:var(--shadow)}
.color-opt .co-check{color:#fff;font-size:18px;display:none}
.color-opt.sel .co-check{display:block}

/* ═══════════════════════════════════════════
   IMAGE UPLOAD
   ═══════════════════════════════════════════ */
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:14px}
.upload-zone:hover{border-color:var(--acc);background:var(--acc-l)}
.upload-zone svg{width:28px;height:28px;color:var(--text3);margin-bottom:8px}
.upload-zone .uz-title{font-size:15px;font-weight:600;color:var(--text)}
.upload-zone .uz-sub{font-size:13px;color:var(--text3);margin-top:4px}
.upload-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text3);font-size:13px}
.upload-divider::before,.upload-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* ═══════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════ */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow3);z-index:1000;animation:toastUp .3s ease;pointer-events:none}
@keyframes toastUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ═══════════════════════════════════════════
   LOADING
   ═══════════════════════════════════════════ */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px;gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--surface3);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:14px;color:var(--text3)}

/* ═══════════════════════════════════════════
   PROFILE HEADER
   ═══════════════════════════════════════════ */
.profile-hdr{text-align:center;padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.avatar{width:48px;height:48px;border-radius:12px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;margin:0 auto 8px}
.profile-name{font-size:16px;font-weight:600;color:var(--text)}
.profile-email{font-size:12px;color:var(--text3);margin-top:1px}

/* ═══════════════════════════════════════════
   FEATURES GRID
   ═══════════════════════════════════════════ */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.fcard{background:var(--surface);border-radius:8px;padding:11px;border:1px solid var(--border)}
.fcard .fc-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;margin-bottom:5px}

const API_BASE = (location.protocol === 'file:' || location.hostname === '') 
  ? 'http://localhost:4000' 
  : location.origin;

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (D.token) headers['Authorization'] = 'Bearer ' + D.token;
  try {
    const res = await fetch(API_BASE + path, { ...opts, headers });
    const json = await res.json();
    if (!json.success) throw new Error(json.error?.message || 'API Error');
    return json.data;
  } catch (err) {
    if (err.message.includes('fetch')) throw new Error('No se pudo conectar al servidor');
    throw err;
  }
}

// Loads nearby stores from the backend into the local STORES array.
// The mock STORES data is kept as offline fallback when the API is unreachable.
async function loadStores() {
  try {
    const stores = await api('/api/v1/stores/nearby?lat=' + USER_LOC.lat + '&lng=' + USER_LOC.lng + '&radius=25');
    if (Array.isArray(stores) && stores.length > 0) {
      const mapped = stores.map(s => ({
        id: s.id || s.storeId,
        name: s.name || 'Tienda',
        retailer: s.retailer || s.chain || s.name || '',
        addr: s.address || s.addr || s.formattedAddress || '',
        lat: typeof s.lat === 'number' ? s.lat : (s.latitude ?? 0),
        lng: typeof s.lng === 'number' ? s.lng : (s.longitude ?? 0),
      })).filter(s => s.id);
      if (mapped.length > 0) STORES.splice(0, STORES.length, ...mapped);
    }
  } catch (err) {
    console.warn('Could not load stores from API:', err.message);
  }
}

// ─── RENDER HELPERS ───
function $(id){return document.getElementById(id)}
function icon(name,size=22){return `<div style="width:${size}px;height:${size}px;display:flex">${I[name]||''}</div>`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){if(isNaN(n)||n==null)return'$0.00';return'$'+Number(n).toFixed(2)}
function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function distKm(a,b){const R=6371,dl=(b.lat-a.lat)*Math.PI/180,dg=(b.lng-a.lng)*Math.PI/180;const h=Math.sin(dl/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dg/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}

// ─── AUTH ───
// Local (offline) auth: creates a local user so the demo works without backend.
function localAuth(name,email){
  const user={id:'user_'+Date.now(),name,email,createdAt:new Date().toISOString()};
  return{user,token:'local_'+Date.now(),refreshToken:'local_'+Date.now()};
}
async function doLogin(){
  const email=($('loginEmail').value||'').trim();
  const password=$('loginPass').value||'';
  if(!email){showToast('Ingresa tu email');return}
  if(!password){showToast('Ingresa tu contraseña');return}
  try{
    const data=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({email,password})});
    D.token=data.token;D.refreshToken=data.refreshToken;D.user=data.user;
    saveState();loadStores();
    if(!D.onboarded){go('s-onboard')}else{go('s-home')}
  }catch(err){
    // Offline fallback: create local user so demo always works
    const fallback=localAuth(email.split('@')[0],email);
    D.token=fallback.token;D.refreshToken=fallback.refreshToken;D.user=fallback.user;
    saveState();loadStores();
    showToast('Modo demo (sin servidor)');
    if(!D.onboarded){go('s-onboard')}else{go('s-home')}
  }
}
async function doRegister(){
  const name=$('regName').value.trim();
  const email=$('regEmail').value.trim();
  const password=$('regPass').value||'';
  if(!name){showToast('Ingresa tu nombre');return}
  if(!email||!email.includes('@')){showToast('Ingresa un email válido');return}
  if(password.length<6){showToast('La contraseña debe tener al menos 6 caracteres');return}
  try{
    const data=await api('/api/v1/auth/register',{method:'POST',body:JSON.stringify({email,password,name})});
    D.token=data.token;D.refreshToken=data.refreshToken;D.user=data.user;
    D.onboarded=false;saveState();loadStores();go('s-onboard');
  }catch(err){
    // Offline fallback: create local user so demo always works
    const fallback=localAuth(name,email);
    D.token=fallback.token;D.refreshToken=fallback.refreshToken;D.user=fallback.user;
    D.onboarded=false;saveState();loadStores();
    showToast('Modo demo (sin servidor)');
    go('s-onboard');
  }
}
function doLogout(){D.user=null;D.token=null;D.refreshToken=null;D.currentListId=null;D.onboarded=false;saveState();go('s-login');showToast('Sesión cerrada')}

              return `<div class="color-opt${D.preferences.accent===c?' sel':''}" style="background:${colors[c]}" onclick="D.preferences.accent='${c}';saveState();applyTheme();renderOnboard()"><span class="co-check">${I.check}</span></div>`;

function nextOnboardStep(){
  const step=D.onboardingStep||0;
  // Save data from current step
  if(step===0){
    const name=$('ob-name')?.value;if(name)D.user.name=name;
    const city=$('ob-city')?.value;if(city)D.location.city=city;
    const country=$('ob-country')?.value;if(country)D.location.country=country;
  } else if(step===1){
    const city=$('ob-city')?.value;if(city)D.location.city=city;
    const country=$('ob-country')?.value;if(country)D.location.country=country;
  } else if(step===2){
    const mk=$('ob-vmake')?.value,md=$('ob-vmodel')?.value,ef=parseFloat($('ob-veff')?.value);
    if(mk||md||ef){
      const v={id:'v_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),make:mk||'Mi carro',model:md||'',efficiency:ef||13,name:(mk||'Carro')+' '+(md||'')};
      D.vehicles.push(v);if(!D.defaultVehicle)D.defaultVehicle=v.id;
      saveState();
      // Sync vehicle creation with the backend (keeps working offline if the request fails).
      api('/api/v1/vehicles',{method:'POST',body:JSON.stringify({name:v.name,fuelType:'GASOLINE',make:mk||undefined,model:md||undefined})})
        .then(created=>{v.serverId=created.id;saveState()})
        .catch(err=>console.warn('Vehicle sync failed:',err.message));
    }
  }
  saveState();
  if(step<4){D.onboardingStep=step+1;saveState();renderOnboard()}
  else{D.onboarded=true;saveState();go('s-home')}
}

// ─── PARSING ───
async function parseList(){
  const raw=$('listInput').value.trim();
  if(!raw){showToast('Escribe tu lista primero');return}
  const btn=$('parseBtn');
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Analizando...'}
  try{
    // 1. Create the list on the backend
    const title=(raw.split(/[,;\n]+/)[0]||'Lista de compras').substring(0,60);
    const list=await api('/api/v1/lists',{method:'POST',body:JSON.stringify({title,rawInput:raw})});
    if(!list||!list.id)throw new Error('Respuesta invalida del servidor');
    // 2. Parse it server-side
    D.currentListId=list.id;
    const parsed=await api('/api/v1/lists/'+list.id+'/parse',{method:'POST'});
    const backendItems=parsed?.items||parsed?.list?.items||[];
    if(!Array.isArray(backendItems)||backendItems.length===0)throw new Error('No se detectaron productos');
    // 3. Map backend items to the local item format and go to review
    D.items=backendItems.map(mapBackendItem);
    saveState();renderReview();go('s-review');
  }catch(err){
    // Offline fallback: parse locally so the flow never blocks.
    console.warn('Server parse failed:',err.message);
    showToast(err.message+' — modo sin conexion');
    D.currentListId=null;
    const lines=raw.split(/[,;]+/).map(l=>l.trim()).filter(l=>l);
    D.items=lines.map(line=>parseItem(line));
    saveState();renderReview();go('s-review');
  }
  const btn2=$('parseBtn');
  if(btn2){btn2.disabled=false;btn2.innerHTML='Analizar mi lista'}
}
function matchProduct(text,brand){
  let bestP=null,bestS=0;
  const lower=text.toLowerCase();
  for(const p of PRODUCTS){
    let s=0;const w=p.canon.split(' ');
    for(const x of w){if(lower.includes(x))s+=2}
    if(brand&&p.brand===brand)s+=5;
    if(lower.includes(p.canon))s+=10;
    if(s>bestS){bestS=s;bestP=p}
  }
  return{product:bestP,score:bestS};
}
function parseItem(text){
  let qty=1,unit='pieza',brand=null;
  for(const b of BRANDS){if(text.toLowerCase().includes(b.toLowerCase())){brand=b;break}}
  const m=text.match(/(\d+(?:\.\d+)?)\s*(litros?|lt|l|ml|kilos?|kg|gramos?|g|onzas?|oz|piezas?|pzs?|pzas?|rollos?|paquetes?)/i);
  if(m){qty=parseFloat(m[1]);const u=m[2].toLowerCase();if(u.startsWith('lit')||u==='lt'||u==='l')unit='litro';else if(u==='ml')unit='ml';else if(u.startsWith('kilo')||u==='kg')unit='kilogramo';else if(u.startsWith('gram')||u==='g')unit='gramo';else if(u.startsWith('p'))unit='pieza';else if(u.startsWith('roll'))unit='rollo'}
  const{product:bestP,score:bestS}=matchProduct(text,brand);
  const ml=bestS>=10?'EXACT':bestS>=5?'VARIANTE':bestS>=2?'SUSTITUTO':'NO_ENCONTRADO';
  return{id:'i_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),raw:text,name:bestP?.name||text.replace(/^\d+(?:\.\d+)?\s*\w+\s+de?\s*/i,'').trim(),brand:brand||bestP?.brand||null,qty,unit,product:bestP,matchLevel:ml,priority:'REQUIRED',allowsSub:true,found:false,notFound:false,price:null};
}

// Maps backend list items to the local item shape used by the review screen.
const MATCH_LEVEL_MAP={EXACT_MATCH:'EXACT',PRODUCT_VARIANT_MATCH:'VARIANTE',ACCEPTABLE_SUBSTITUTE:'SUSTITUTO'};
function mapBackendItem(it){
  const raw=it.rawInput||it.originalText||it.normalizedName||'Producto';
  const name=it.normalizedName||it.displayName||raw;
  const matchLevel=MATCH_LEVEL_MAP[it.matchLevel]||'NO_ENCONTRADO';
  let brand=it.brand||null;
  if(!brand){for(const b of BRANDS){if(raw.toLowerCase().includes(b.toLowerCase())){brand=b;break}}}
  const{product}=matchProduct(raw,brand);
  return{
    id:it.id||('i_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)),
    raw,name,brand,
    qty:it.quantity??it.qty??1,
    unit:it.unit||'pieza',
    product:matchLevel==='NO_ENCONTRADO'?null:product,
    matchLevel,
    priority:it.priority||'REQUIRED',
    allowsSub:true,found:false,notFound:false,price:null,
  };
}

// ─── OPTIMIZATION ENGINE ───
async function runOptimization(){
  const matched=D.items.filter(i=>i.product);
  if(matched.length===0){showToast('No se encontraron productos coincidentes.');return}
  try{
    const result=await api('/api/v1/optimize',{method:'POST',body:JSON.stringify({listId:D.currentListId,mode:'BALANCED',userLocation:{latitude:USER_LOC.lat,longitude:USER_LOC.lng}})});
    const plan=mapBackendPlan(result);
    if(!plan)throw new Error('Respuesta invalida del servidor');
    D.plans=[plan];D.plan=plan;D._planSource='review';
    saveState();renderPlan();go('s-plan');updateHomeStats();
  }catch(err){
    // Offline fallback: run the local optimization engine.
    console.warn('Server optimization failed:',err.message);
    showToast(err.message+' — optimizando localmente');
    runLocalOptimization();
  }
}

// Converts backend monetary amounts (cents) to the dollar format shown in the UI.
function centsToMoney(v){return typeof v==='number'?v/100:0}

// Maps the backend plan result to the plan shape used by renderPlan/startMission.
function mapBackendPlan(res){
  const plan=res&&res.plan?res.plan:res;
  if(!plan||typeof plan!=='object')return null;
  const stopsRaw=Array.isArray(plan.stops)?plan.stops:Array.isArray(plan.stores)?plan.stores:null;
  if(!stopsRaw||stopsRaw.length===0)return null;
  const stops=stopsRaw.map((st,i)=>{
    const s=st.store||st;
    const store={
      id:s.id||s.storeId||('srv_'+i),
      name:s.name||'Tienda',
      retailer:s.retailer||s.chain||s.name||'',
      addr:s.address||s.addr||s.formattedAddress||'',
      lat:typeof s.lat==='number'?s.lat:(s.latitude??0),
      lng:typeof s.lng==='number'?s.lng:(s.longitude??0),
    };
    const items=(Array.isArray(st.items)?st.items:[]).map(it=>{
      const price=centsToMoney(it.unitPriceCents??it.priceCents??it.unitPrice??it.price);
      const lineCost=centsToMoney(it.lineTotalCents??it.totalCents??it.lineCostCents??it.subtotalCents??it.lineCost)||(price*(it.quantity??it.qty??1));
      const promo=it.promoName||it.promoLabel||(typeof it.promo==='string'?it.promo:null);
      return{
        id:it.id||it.itemId||it.listItemId||('mi_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)),
        name:it.name||it.normalizedName||it.displayName||it.rawInput||'Producto',
        qty:it.quantity??it.qty??1,
        unit:it.unit||'pieza',
        price,lineCost,promo,
      };
    });
    const productCost=centsToMoney(st.productCostCents??st.subtotalCents??st.productsCostCents)||items.reduce((a,x)=>a+x.lineCost,0);
    const transportCost=centsToMoney(st.transportCostCents??st.travelCostCents??st.transportCost);
    const distance=typeof st.distanceKm==='number'?st.distanceKm:(typeof st.distance==='number'?st.distance:0);
    return{
      order:st.order??(i+1),store,productCost,transportCost,items,distance,
      promos:[...new Set(items.filter(x=>x.promo).map(x=>x.promo))],
    };
  });
  const totalProduct=stops.reduce((a,s)=>a+s.productCost,0);
  const totalTransport=stops.reduce((a,s)=>a+s.transportCost,0);
  let totalDist=plan.totalDistanceKm??plan.totalDistance;
  if(typeof totalDist!=='number')totalDist=stops.reduce((a,s)=>a+s.distance*2,0);
  let totalTime=plan.totalTimeMin??plan.estimatedTimeMin??plan.totalTime;
  if(typeof totalTime!=='number')totalTime=Math.round(totalDist/30*60+stops.length*10);
  let effective=centsToMoney(plan.totalCostCents??plan.effectiveCents??plan.grandTotalCents);
  if(!effective)effective=totalProduct+totalTransport;
  let savings=centsToMoney(plan.savingsCents??plan.savings);
  let baseline=centsToMoney(plan.baselineCents??plan.baseline);
  if(!baseline)baseline=savings>0?totalProduct+savings:totalProduct;
  if(!savings)savings=Math.max(0,baseline-totalProduct);
  return{
    serverId:plan.id||null,
    mode:plan.mode||'BALANCED',
    stores:stops,
    totalProduct,totalTransport,totalDist,totalTime,effective,baseline,savings,
    confidence:plan.confidence==='HIGH'||plan.confidence==='high'?'HIGH':'MEDIUM',
  };
}

function runLocalOptimization(){
  const matched=D.items.filter(i=>i.product);
  if(matched.length===0){showToast('No se encontraron productos coincidentes.');return}

  // Score each store
  const scores=STORES.map(store=>{
    const dist=distKm(USER_LOC,{lat:store.lat,lng:store.lng});
    let cost=0;const items=[];
    for(const item of matched){
      const seed=(store.id+item.product.id).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
      const base=BASE[item.product.id]||40;
      const var_=((seed%20)-10)/100;
      let price=base*(1+var_);
      const promo=PROMOS.find(p=>p.sid===store.id&&p.prods.includes(item.product.id));
      if(promo){if(promo.card&&!D.hasMembership){}else if(promo.memb&&!D.hasMembership){}else{if(promo.type==='2x1'&&item.qty>=2)price*=(Math.floor(item.qty/2)+item.qty%2)/item.qty;else if(promo.type==='3x2'&&item.qty>=3)price*=(Math.floor(item.qty/3)*2+item.qty%3)/item.qty;else if(promo.type==='pct')price*=(1-promo.disc)}}
      const lc=price*item.qty;cost+=lc;items.push({...item,price,lineCost:lc,promo:promo?promo.name:null});
    }
    const fuelEff=D.vehicles.find(v=>v.id===D.defaultVehicle)?.efficiency||13;
    const tc=(dist*2/fuelEff)*24.5;
    return{store,dist,productCost:cost,transportCost:tc,effective:cost+tc,items,avail:items.length,total:matched.length};
  }).filter(s=>s.avail>0);

  scores.sort((a,b)=>a.effective-b.effective);
  const plans=[];
  if(scores.length>=1)plans.push(buildPlan('BALANCED',[scores[0]],matched));
  if(scores.length>=2){const sp=buildSplitPlan(matched);if(sp)plans.push(sp)}
  if(scores.length>=1)plans.push(buildPlan('CONVENIENCE',[scores[0]],matched));

  const seen=new Set();const unique=[];
  for(const p of plans){const k=p.stores.map(s=>s.store.id).sort().join(',');if(!seen.has(k)){seen.add(k);unique.push(p)}}

  D.plans=unique;D.plan=unique[0];D._planSource='review';saveState();renderPlan();go('s-plan');updateHomeStats();
}

function buildPlan(mode,scores,allItems){
  const stops=scores.map((s,i)=>({order:i+1,store:s.store,productCost:s.productCost,transportCost:s.transportCost,items:s.items,distance:s.dist,promos:[...new Set(s.items.filter(x=>x.promo).map(x=>x.promo))]}));
  const tp=stops.reduce((a,s)=>a+s.productCost,0);const tt=stops.reduce((a,s)=>a+s.transportCost,0);const td=stops.reduce((a,s)=>a+s.distance*2,0);const tm=Math.round(td/30*60+stops.length*10);
  let bl=0;for(const item of allItems){let m=0;STORES.forEach(st=>{const sd=(st.id+item.product.id).split('').reduce((a,c)=>a+c.charCodeAt(0),0);m=Math.max(m,(BASE[item.product.id]||40)*(1+((sd%20)-10)/100))});bl+=m*item.qty}
  return{mode,stores:stops,totalProduct:tp,totalTransport:tt,totalDist:td,totalTime:tm,effective:tp+tt,baseline:bl,savings:Math.max(0,bl-tp),confidence:td<15?'HIGH':'MEDIUM'};
}
function buildSplitPlan(allItems){
  const is=allItems.map(item=>{let best=null,bp=Infinity;for(const store of STORES){const sd=(store.id+item.product.id).split('').reduce((a,c)=>a+c.charCodeAt(0),0);const base=BASE[item.product.id]||40;let price=base*(1+((sd%20)-10)/100);const pr=PROMOS.find(p=>p.sid===store.id&&p.prods.includes(item.product.id));if(pr&&(pr.card?D.hasMembership:true)&&(pr.memb?D.hasMembership:true)){if(pr.type==='2x1'&&item.qty>=2)price*=(Math.floor(item.qty/2)+item.qty%2)/item.qty;else if(pr.type==='3x2'&&item.qty>=3)price*=(Math.floor(item.qty/3)*2+item.qty%3)/item.qty;else if(pr.type==='pct')price*=(1-pr.disc)}if(price*item.qty<bp){bp=price*item.qty;best={store,price,lineCost:price*item.qty,promo:pr?pr.name:null}}}return{...item,...best}});
  const byS={};for(const x of is){if(!byS[x.store.id])byS[x.store.id]={store:x.store,items:[],productCost:0};byS[x.store.id].items.push(x);byS[x.store.id].productCost+=x.lineCost}
  const sts=Object.values(byS);if(sts.length<=1)return null;
  const tp=sts.reduce((a,s)=>a+s.productCost,0);const td=sts.reduce((a,s)=>a+distKm(USER_LOC,{lat:s.store.lat,lng:s.store.lng})*2,0);const fuelEff=D.vehicles.find(v=>v.id===D.defaultVehicle)?.efficiency||13;const tt=(td/fuelEff)*24.5;const tm=Math.round(td/30*60+sts.length*10);
  let bl=0;allItems.forEach(item=>{let m=0;STORES.forEach(st=>{const sd=(st.id+item.product.id).split('').reduce((a,c)=>a+c.charCodeAt(0),0);m=Math.max(m,(BASE[item.product.id]||40)*(1+((sd%20)-10)/100))});bl+=m*item.qty});
  return{mode:'MAX_SAVINGS',stores:sts.map((s,i)=>({...s,order:i+1,transportCost:0,distance:distKm(USER_LOC,{lat:s.store.lat,lng:s.store.lng}),promos:[...new Set(s.items.filter(x=>x.promo).map(x=>x.promo))]})),totalProduct:tp,totalTransport:tt,totalDist:td,totalTime:tm,effective:tp+tt,baseline:bl,savings:Math.max(0,bl-tp),confidence:td<15?'HIGH':'MEDIUM'};
}

// ─── RENDER PLAN ───
function renderPlan(){
  const p=D.plan;if(!p)return;
  const modeN={BALANCED:'Equilibrado',MAX_SAVINGS:'Máximo Ahorro',CONVENIENCE:'Máxima Comodidad'};
  let html='';
  if(p.savings>0)html+=`<div class="savings"><div class="s-label">Ahorro estimado</div><div class="s-amount">${fmt(p.savings)}</div></div>`;
  html+=`<div class="card">
    <div class="sr"><span class="sl">Productos</span><span class="sv">${fmt(p.totalProduct)}</span></div>
    <div class="sr"><span class="sl">Transporte</span><span class="sv">${fmt(p.totalTransport)}</span></div>
    <div class="sr sr-total"><span class="sl">Total estimado</span><span class="sv">${fmt(p.effective)}</span></div>
  </div>`;
  html+=`<div class="conf ${p.confidence==='HIGH'?'high':'med'}">${I.shield} Confianza ${p.confidence==='HIGH'?'Alta':'Media'}</div>`;
  html+=`<div class="card"><div class="sec-title" style="margin-bottom:8px">Ruta</div>
    <div class="metrics">
      <div class="metric"><div class="mv">${p.totalTime} min</div><div class="ml">Tiempo</div></div>
      <div class="metric"><div class="mv">${p.totalDist.toFixed(1)} km</div><div class="ml">Distancia</div></div>
      <div class="metric"><div class="mv">${p.stores.length}</div><div class="ml">Tiendas</div></div>
    </div></div>`;

  html+=`<div class="sec-title">Paradas</div>`;
  p.stores.forEach((stop,i)=>{
    html+=`<div class="stop"><div class="stop-head"><div class="stop-num">${i+1}</div><div class="stop-body"><div class="stop-name">${stop.store.name}</div><div class="stop-addr">${stop.store.retailer} - ${stop.store.addr}</div></div><div class="stop-cost">${fmt(stop.productCost)}</div></div>
      <div class="stop-items">${stop.items.map(item=>`<div class="si-row"><span class="si-dot">${item.promo?I.tag:I.check}</span><span class="si-n">${esc(item.name)}</span><span class="si-q">x${item.qty}</span><span class="si-p">${fmt(item.lineCost)}</span></div>`).join('')}</div>
      ${stop.promos.length?`<div class="promo-row">${stop.promos.map(p=>`<span class="tag">${I.tag} ${p}</span>`).join('')}</div>`:''}</div>`;
  });

  html+=`<div class="sec-title">Por que este plan?</div>`;
  p.stores.forEach(s=>{html+=`<div class="exp"><div class="exp-icon">${I.check}</div><div class="exp-text">Recomendamos <strong>${s.store.retailer}</strong> porque ${s.items.length} productos estan disponibles a ${fmt(s.productCost)}.</div></div>`});
  if(p.savings>0)html+=`<div class="exp"><div class="exp-icon">${I.dollar}</div><div class="exp-text">Ahorras <strong>${fmt(p.savings)}</strong> comparado con la opcion mas cara (${fmt(p.baseline)}).</div></div>`;
  if(p.totalTransport>0)html+=`<div class="exp"><div class="exp-icon">${I.car}</div><div class="exp-text">Costo de transporte estimado: <strong>${fmt(p.totalTransport)}</strong>.</div></div>`;

  html+=`<div class="sec-title">Notas</div><div class="assume">Los precios son aproximados y pueden variar.</div><div class="assume">Tiempos de viaje son estimados.</div><div class="assume">La disponibilidad no esta confirmada.</div>`;

  $('s-plan').innerHTML=`<div class="navbar"><button class="icon-btn" onclick="go(D._planSource==='plans'?'s-plans':'s-review');D._planSource=null">${I.back}</button><h2>Tu plan optimizado</h2></div><div class="content">${html}</div><div class="bottom"><button class="btn btn-p" onclick="startMission()">Iniciar compra</button></div>`;
}

// ─── MISSION ───
async function startMission(){
  const p=D.plan;if(!p)return;
  D.mission={items:p.stores.flatMap(s=>s.items.map(item=>({...item,storeName:s.store.name,storeId:s.store.id,status:'pending',actualPrice:null}))),startTime:Date.now()};
  saveState();renderMissionScreen();go('s-mission');
  // Create the mission on the backend so progress can be tracked server-side.
  if(p.serverId&&D.currentListId){
    try{
      const m=await api('/api/v1/missions',{method:'POST',body:JSON.stringify({planId:p.serverId,listId:D.currentListId})});
      if(D.mission){
        D.mission.serverId=m.id||null;
        const remoteItems=Array.isArray(m.items)?m.items:[];
        for(const li of D.mission.items){
          const rm=remoteItems.find(x=>x.id===li.id||x.listItemId===li.id||x.name===li.name);
          if(rm)li.serverId=rm.id;
        }
        saveState();
      }
    }catch(err){
      console.warn('Mission sync failed:',err.message);
    }
  }
}
function renderMissionScreen(){
  const m=D.mission;if(!m)return;
  const total=m.items.length;const found=m.items.filter(i=>i.status==='found').length;const nf=m.items.filter(i=>i.status==='notfound').length;const done=found+nf;const pct=total?Math.round((done/total)*100):0;

  let html=`<div class="navbar"><button class="icon-btn" onclick="go('s-plan')">${I.back}</button><h2>En compras</h2><button class="btn btn-sm btn-s" style="color:var(--err);border-color:var(--err)" onclick="D.mission=null;saveState();go('s-home')">Cancelar</button></div>`;
  html+=`<div style="padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)"><div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div><div class="prog-text">${done}/${total} (${pct}%)</div></div>`;
  html+=`<div class="content">`;

  const pending=m.items.filter(i=>i.status==='pending');
  const foundI=m.items.filter(i=>i.status==='found');
  const notFoundI=m.items.filter(i=>i.status==='notfound');

  if(pending.length){html+=`<div class="sec-title">Por comprar (${pending.length})</div>`;pending.forEach(item=>{html+=`<div class="mi"><div class="mi-info"><div class="mi-name">${esc(item.name)}</div><div class="mi-sub">Esperado: ${fmt(item.price*item.qty)} - ${esc(item.storeName)}</div></div><div class="mi-acts"><button class="mi-btn ok" onclick="markItem('${item.id}','found')" title="Encontrado">${I.check}</button><button class="mi-btn no" onclick="markItem('${item.id}','notfound')" title="No encontrado">${I.x}</button></div></div>`})}
  if(foundI.length){html+=`<div class="sec-title">Encontrados (${foundI.length})</div>`;foundI.forEach(item=>{html+=`<div class="mi found"><div class="mi-info"><div class="mi-name">${esc(item.name)}</div><div class="mi-sub">${esc(item.storeName)}</div></div></div>`})}
  if(notFoundI.length){html+=`<div class="sec-title">No encontrados (${notFoundI.length})</div>`;notFoundI.forEach(item=>{html+=`<div class="mi missed"><div class="mi-info"><div class="mi-name">${esc(item.name)}</div><div class="mi-sub">No disponible</div></div></div>`})}

  html+=`</div>`;
  if(done>=total&&found>0)html+=`<div class="bottom"><button class="btn btn-p" onclick="completeMission()">Finalizar compra</button></div>`;

  $('s-mission').innerHTML=html;
}
function markItem(id,status){
  const m=D.mission;
  const item=m?m.items.find(i=>i.id===id):null;
  if(!item)return;
  item.status=status;saveState();renderMissionScreen();
  if(m.serverId&&item.serverId){
    api('/api/v1/missions/'+m.serverId+'/items/'+item.serverId,{method:'PUT',body:JSON.stringify({status:status==='found'?'FOUND':'NOT_FOUND'})})
      .catch(err=>console.warn('Mission item sync failed:',err.message));
  }
}
async function completeMission(){
  const m=D.mission;if(!m)return;
  const found=m.items.filter(i=>i.status==='found');
  const spent=found.reduce((a,i)=>a+i.price*i.qty,0);const planned=found.reduce((a,i)=>a+i.lineCost,0);
  let saved=Math.max(0,planned-spent);
  if(m.serverId){
    try{
      const res=await api('/api/v1/missions/'+m.serverId+'/complete',{method:'POST'});
      const centsValue=res?.savingsCents??res?.summary?.savingsCents??res?.savings;
      if(typeof centsValue==='number')saved=centsValue/100;
    }catch(err){
      console.warn('Mission completion sync failed:',err.message);
    }
  }
  D.totalSaved+=saved;
  D.lists.push({id:'l_'+Date.now(),title:D.items.map(i=>i.name).join(', ').substring(0,60),items:D.items.length,date:new Date().toISOString(),saved});
  D.mission=null;saveState();updateHomeStats();showToast('Compra completada! Total: '+fmt(spent));go('s-home');
}

// ─── HOME STATS ───
function updateHomeStats(){
  if(D.lists.length>0||D.plans.length>0){
    D._hasStats=true;saveState();
  }
}

// ─── SCREEN ROUTER ───
function renderScreen(id){
  switch(id){
    case 's-onboard':renderOnboard();break;
    case 's-home':renderHome();break;
    case 's-lists':renderLists();break;
    case 's-plans':renderPlans();break;
    case 's-profile':renderProfile();break;
    case 's-create':renderCreate();break;
    case 's-review':renderReview();break;
    case 's-plan':renderPlan();break;
    case 's-mission':renderMissionScreen();break;
    case 's-settings-vehicles':renderVehicles();break;
    case 's-settings-appearance':renderAppearance();break;
    case 's-settings-location':renderLocation();break;
  }
}

loadStores();
if(D.user&&D.onboarded){go('s-home')}
else if(D.user&&!D.onboarded){go('s-onboard')}
else{go('s-login')}
</script>
